[package]
name = "topo-private-cloudflare"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "=0.8.7"
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
web-sys = { version = "=0.3.106", features = ["Crypto", "CryptoKey", "SubtleCrypto", "WorkerGlobalScope"] }
