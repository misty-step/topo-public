name = "topo-maps"
main = "private-cloudflare/build/index.js"
compatibility_date = "2026-10-09"
workers_dev = false
preview_urls = false

[assets]
directory = ".cache/private-site"
binding = "ASSETS"
run_worker_first = true
# Preserve native offline index.html/scope-*.html links without redirects.
# The authenticated Worker resolves the three directory entry points itself.
html_handling = "none"
not_found_handling = "none"

[build]
command = "cd private-cloudflare && prlimit --as=4294967296 -- env CARGO_BUILD_JOBS=1 CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 ../.cache/tools/bin/worker-build --release"

[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
PRIVATE_HOST = ""
